      <stop offset="0%" stop-color="#06121e"/>
      <stop offset="100%" stop-color="#0d2438"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
