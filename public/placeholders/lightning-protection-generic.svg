  <text x="400" y="490" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="20" font-weight="600" letter-spacing="2">LIGHTNING & EARTHING</text>
  <text x="400" y="520" text-anchor="middle" fill="#6b7280" font-family="system-ui, sans-serif" font-size="14">Sample Image Placeholder</text>
